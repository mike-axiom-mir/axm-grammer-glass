name: Reconcile ledger recovery

on:
  push:
    branches:
      - integration/growth-days-20260912

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/growth-days-20260912
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Merge recovery without weakening receipt admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          cp tools/grammar-glass/discovery-kiln-core.js /tmp/current-core.js
          git show origin/chat/4-discovery-ledger-recovery-gate:tools/grammar-glass/discovery-kiln-core.js > /tmp/recovery-core.js

          set +e
          git merge --no-ff --no-commit origin/chat/4-discovery-ledger-recovery-gate
          rc=$?
          set -e
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PY'
          import subprocess
          allowed={'README.md','tools/grammar-glass/discovery-kiln-core.js'}
          actual=set(filter(None,subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()))
          if actual-allowed:
              raise SystemExit(f'unexpected conflicts: {sorted(actual-allowed)}')
          print('expected conflicts:',sorted(actual))
          PY
          fi

          if echo "$unresolved" | grep -qx 'README.md'; then git checkout --ours README.md; fi
          if echo "$unresolved" | grep -qx 'tools/grammar-glass/discovery-kiln-core.js'; then git checkout --ours tools/grammar-glass/discovery-kiln-core.js; fi

          python3 - <<'PY'
          from pathlib import Path

          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          anchor='The static viewer records the combination identity, replay inputs and grounded receipt digest in an append-only device-local ledger.'
          addition=' Invalid, corrupted or wrong-snapshot ledger bytes produce a sealed load HOLD and remain untouched; the viewer cannot silently reinterpret them as empty history or overwrite them during preparation. Export remains available while held, and an explicit user-confirmed reset first stores the exact bytes in a content-addressed local quarantine. See `docs/DISCOVERY_LEDGER_RECOVERY_CONTRACT_V1.md`.'
          if addition.strip() not in text:
              if anchor not in text: raise SystemExit('README insertion anchor missing')
              text=text.replace(anchor,anchor+addition,1)
          readme.write_text(text,encoding='utf-8')

          def fn(src,name):
              start=src.find(f'function {name}(')
              if start < 0: raise SystemExit(f'missing function {name}')
              end=src.find('\nfunction ',start+1)
              if end < 0: end=src.find('\nconst api=',start+1)
              if end < 0: end=len(src)
              return src[start:end].rstrip()

          current=Path('/tmp/current-core.js').read_text(encoding='utf-8')
          recovery=Path('/tmp/recovery-core.js').read_text(encoding='utf-8')
          target=current
          states="const STATES=Object.freeze(['ROLLED','GROUNDED','HELD','DRAFT_STAR','CANDIDATE','SANDBOX','RECEIPT']);"
          constants="\nconst LEDGER_SCHEMA='axm.code.grammar-glass-local-discovery-ledger.v1';\nconst LOAD_SCHEMA='axm.code.grammar-glass-local-discovery-ledger-load.v1';\nconst QUARANTINE_SCHEMA='axm.code.grammar-glass-local-discovery-ledger-quarantine.v1';"
          if 'const LEDGER_SCHEMA=' not in target:
              if states not in target: raise SystemExit('constant insertion anchor missing')
              target=target.replace(states,states+constants,1)

          for name in ('emptyLedger','validLedger'):
              target=target.replace(fn(target,name),fn(recovery,name),1)

          names=('bytesOf','sealLoadReceipt','validLoadReceipt','inspectLedgerStorage','createLedgerQuarantine','createLedgerRecovery')
          bundle='\n'.join(fn(recovery,name) for name in names)+'\n'
          if 'function inspectLedgerStorage(' not in target:
              marker='function appendEvent('
              pos=target.find(marker)
              if pos < 0: raise SystemExit('recovery insertion anchor missing')
              target=target[:pos]+bundle+target[pos:]

          old='emptyLedger,validLedger,combinationSummary'
          new='emptyLedger,validLedger,validLoadReceipt,inspectLedgerStorage,createLedgerQuarantine,createLedgerRecovery,combinationSummary'
          if new not in target:
              if old not in target: raise SystemExit('API insertion anchor missing')
              target=target.replace(old,new,1)

          Path('tools/grammar-glass/discovery-kiln-core.js').write_text(target,encoding='utf-8')
          PY

          node --check tools/grammar-glass/discovery-kiln-core.js
          node tools/grammar-glass/selftest-discovery-receipt-admission.js
          node tools/grammar-glass/selftest-discovery-kiln.js
          npm test
          git diff --check

          rm .github/workflows/reconcile-ledger-recovery.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "Integrate discovery ledger recovery with receipt integrity"
          git push origin HEAD:integration/growth-days-20260912
