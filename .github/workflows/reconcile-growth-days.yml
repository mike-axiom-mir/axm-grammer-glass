name: Reconcile Grammar Glass growth lanes

on:
  push:
    branches:
      - integration/growth-days-20260912

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/growth-days-20260912
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Reconcile held growth lanes without weakening current gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          merge_with_expected_conflicts() {
            local ref="$1"
            set +e
            git merge --no-ff --no-commit "$ref"
            local rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
              echo "merge failed without resolvable file conflicts: $ref"
              exit "$rc"
            fi
          }

          verify_conflicts_subset() {
            python3 - "$@" <<'PY'
          import subprocess, sys
          allowed=set(sys.argv[1:])
          actual=set(filter(None, subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()))
          unexpected=actual-allowed
          if unexpected:
              raise SystemExit(f'unexpected merge conflicts: {sorted(unexpected)}')
          print('conflicts:', sorted(actual))
          PY
          }

          # PR #9: preserve invalid local history while retaining #15 receipt admission.
          cp README.md /tmp/readme-before-ledger-merge.md
          cp tools/grammar-glass/discovery-kiln-core.js /tmp/discovery-core-before-ledger-merge.js
          merge_with_expected_conflicts origin/chat/4-discovery-ledger-recovery-gate
          verify_conflicts_subset README.md tools/grammar-glass/discovery-kiln-core.js
          if git diff --name-only --diff-filter=U | grep -qx 'README.md'; then
            git checkout --ours README.md
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          anchor='The static viewer records the combination identity, replay inputs and grounded receipt digest in an append-only device-local ledger.'
          recovery=' Invalid, corrupted or wrong-snapshot ledger bytes produce a sealed load HOLD and remain untouched; the viewer cannot silently reinterpret them as empty history or overwrite them during preparation. Export remains available while held, and an explicit user-confirmed reset first stores the exact bytes in a content-addressed local quarantine. See `docs/DISCOVERY_LEDGER_RECOVERY_CONTRACT_V1.md`.'
          if recovery.strip() not in text:
              if anchor not in text:
                  raise SystemExit('README recovery insertion anchor missing')
              text=text.replace(anchor, anchor+recovery, 1)
          p.write_text(text, encoding='utf-8')
          PY
          if git diff --name-only --diff-filter=U | grep -qx 'tools/grammar-glass/discovery-kiln-core.js'; then
            git checkout --theirs tools/grammar-glass/discovery-kiln-core.js
          fi
          python3 - <<'PY'
          from pathlib import Path

          def extract_function(src, name):
              token=f'function {name}('
              start=src.find(token)
              if start < 0:
                  raise SystemExit(f'missing function {name}')
              brace=src.find('{', start)
              if brace < 0:
                  raise SystemExit(f'missing body for {name}')
              depth=0
              quote=None
              escape=False
              i=brace
              while i < len(src):
                  ch=src[i]
                  if quote:
                      if escape:
                          escape=False
                      elif ch=='\\':
                          escape=True
                      elif ch==quote:
                          quote=None
                  else:
                      if ch in "'\"`":
                          quote=ch
                      elif ch=='{':
                          depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              return src[start:i+1]
                  i+=1
              raise SystemExit(f'unclosed function {name}')

          ours=Path('/tmp/discovery-core-before-ledger-merge.js').read_text(encoding='utf-8')
          path=Path('tools/grammar-glass/discovery-kiln-core.js')
          target=path.read_text(encoding='utf-8')
          digest=extract_function(ours,'digestCurrent')
          valid=extract_function(ours,'validConstructionReceipt')
          record=extract_function(ours,'recordConstructionReceipt')
          if 'function digestCurrent(' not in target:
              marker='function freeze(value)'
              if marker not in target:
                  raise SystemExit('digest insertion marker missing')
              target=target.replace(marker, digest+'\n'+marker, 1)
          old_record=extract_function(target,'recordConstructionReceipt')
          target=target.replace(old_record, valid+'\n'+record, 1)
          old_api='recordPreparation,recordSandboxReceipt,recordConstructionReceipt});'
          new_api='recordPreparation,recordSandboxReceipt,validConstructionReceipt,recordConstructionReceipt});'
          if new_api not in target:
              if old_api not in target:
                  raise SystemExit('discovery core API insertion marker missing')
              target=target.replace(old_api,new_api,1)
          path.write_text(target, encoding='utf-8')
          PY
          node --check tools/grammar-glass/discovery-kiln-core.js
          git add README.md docs tools/grammar-glass/discovery-kiln-core.js tools/grammar-glass/discovery-kiln.js tools/grammar-glass/selftest-discovery-kiln.js
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "Integrate discovery ledger recovery with receipt integrity"

          # PR #13: retain current receipt admission while adding exact replay admission.
          cp package.json /tmp/package-before-executor-merge.json
          cp shared/code-capability-fabric/language-organs/code-grammar-glass-construction-hand.contract.json /tmp/contract-before-executor-merge.json
          git show origin/automation/truth-sentinel-executor-replay-admission-20260909:package.json > /tmp/package-executor-theirs.json
          git show origin/automation/truth-sentinel-executor-replay-admission-20260909:shared/code-capability-fabric/language-organs/code-grammar-glass-construction-hand.contract.json > /tmp/contract-executor-theirs.json
          merge_with_expected_conflicts origin/automation/truth-sentinel-executor-replay-admission-20260909
          verify_conflicts_subset package.json shared/code-capability-fabric/language-organs/code-grammar-glass-construction-hand.contract.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          ours=json.loads(Path('/tmp/package-before-executor-merge.json').read_text())
          theirs=json.loads(Path('/tmp/package-executor-theirs.json').read_text())
          for key in set(theirs)-{'scripts'}:
              if key in ours and ours[key] != theirs[key]:
                  raise SystemExit(f'package top-level conflict: {key}')
              ours.setdefault(key,theirs[key])
          scripts=ours.setdefault('scripts',{})
          for key,value in theirs.get('scripts',{}).items():
              if key=='test':
                  have=[x.strip() for x in scripts.get('test','').split(' && ') if x.strip()]
                  for cmd in [x.strip() for x in value.split(' && ') if x.strip()]:
                      if cmd not in have:
                          have.append(cmd)
                  scripts['test']=' && '.join(have)
              elif key not in scripts:
                  scripts[key]=value
              elif scripts[key] != value:
                  raise SystemExit(f'package script conflict: {key}')
          Path('package.json').write_text(json.dumps(ours,indent=2)+'\n')

          def merge(a,b,path='root'):
              if isinstance(a,dict) and isinstance(b,dict):
                  out=dict(a)
                  for k,v in b.items():
                      out[k]=merge(out[k],v,f'{path}.{k}') if k in out else v
                  return out
              if a==b:
                  return a
              raise SystemExit(f'contract semantic conflict at {path}: {a!r} != {b!r}')

          a=json.loads(Path('/tmp/contract-before-executor-merge.json').read_text())
          b=json.loads(Path('/tmp/contract-executor-theirs.json').read_text())
          Path('shared/code-capability-fabric/language-organs/code-grammar-glass-construction-hand.contract.json').write_text(json.dumps(merge(a,b),indent=2)+'\n')
          PY
          git add package.json shared/code-capability-fabric/language-organs/code-grammar-glass-construction-hand.contract.json tools/grammar-glass/construction-hand-executor-core.js tools/grammar-glass/selftest-construction-hand-executor-admission.js
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "Integrate exact Construction Hand replay admission"

          # PR #17 frontier carries #7 -> #16 -> #17 State Ripple hardening.
          cp package.json /tmp/package-before-ripple-merge.json
          git show origin/automation/truth-sentinel-ripple-baseline-pin-20260911:package.json > /tmp/package-ripple-theirs.json
          merge_with_expected_conflicts origin/automation/truth-sentinel-ripple-baseline-pin-20260911
          verify_conflicts_subset package.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          ours=json.loads(Path('/tmp/package-before-ripple-merge.json').read_text())
          theirs=json.loads(Path('/tmp/package-ripple-theirs.json').read_text())
          for key in set(theirs)-{'scripts'}:
              if key in ours and ours[key] != theirs[key]:
                  raise SystemExit(f'package top-level conflict: {key}')
              ours.setdefault(key,theirs[key])
          scripts=ours.setdefault('scripts',{})
          for key,value in theirs.get('scripts',{}).items():
              if key=='test':
                  have=[x.strip() for x in scripts.get('test','').split(' && ') if x.strip()]
                  for cmd in [x.strip() for x in value.split(' && ') if x.strip()]:
                      if cmd not in have:
                          have.append(cmd)
                  scripts['test']=' && '.join(have)
              elif key not in scripts:
                  scripts[key]=value
              elif scripts[key] != value:
                  raise SystemExit(f'package script conflict: {key}')
          Path('package.json').write_text(json.dumps(ours,indent=2)+'\n')
          PY
          git add package.json docs/STATE_RIPPLE_V1.md tools/grammar-glass/state-ripple-core.js tools/grammar-glass/selftest-state-ripple-validation.js tools/grammar-glass/selftest-state-ripple-baseline-admission.js
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "Integrate State Ripple validation and baseline continuity"

          # Preserve immutable action references across every final workflow.
          python3 - <<'PY'
          from pathlib import Path
          import re
          replacements={
              'actions/checkout@v4':'actions/checkout@11d5960a326750d5838078e36cf38b85af677262',
              'actions/setup-node@v4':'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020',
              'actions/setup-python@v5':'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065',
              'actions/upload-artifact@v4':'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
          }
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text=path.read_text(encoding='utf-8')
              for old,new in replacements.items():
                  text=text.replace(old,new)
              path.write_text(text,encoding='utf-8')

          verify=Path('.github/workflows/verify-grammar-glass.yml')
          text=verify.read_text(encoding='utf-8')
          start="          workflow = Path('.github/workflows/verify-grammar-glass.yml')\n"
          end="          print('all external GitHub Action references are immutable commit SHAs')\n"
          if start in text:
              a=text.index(start)
              b=text.index(end,a)+len(end)
              replacement="""          workflows = sorted(Path('.github/workflows').glob('*.y*ml'))\n          bad = []\n          for workflow in workflows:\n              for number, line in enumerate(workflow.read_text(encoding='utf-8').splitlines(), 1):\n                  match = re.match(r'^\\s*-\\s*uses:\\s*([^#\\s]+)', line)\n                  if not match:\n                      continue\n                  reference = match.group(1)\n                  if reference.startswith('./'):\n                      continue\n                  if not re.search(r'@[0-9a-f]{40}$', reference):\n                      bad.append((workflow.as_posix(), number, reference))\n          if bad:\n              for workflow, number, reference in bad:\n                  print(f'non-immutable action reference at {workflow}:{number}: {reference}')\n              raise SystemExit(1)\n          print('all external GitHub Action references across repository workflows are immutable commit SHAs')\n"""
              text=text[:a]+replacement+text[b:]
          verify.write_text(text,encoding='utf-8')
          PY

          # Contract changes invalidate the source-backed discovery receipt by design.
          node tools/capability-discovery/generate-registry.mjs

          # Remove this one-shot helper before the combined state is published.
          rm .github/workflows/reconcile-growth-days.yml

          # Combined evidence before publication.
          node --check tools/grammar-glass/discovery-kiln-core.js
          node --check tools/grammar-glass/construction-hand-executor-core.js
          npm test
          node tools/grammar-glass/selftest-static-overview.js
          node tools/grammar-glass/selftest-construction-hand-experience.js
          node tools/capability-discovery/test-registry.mjs
          node tools/capability-discovery/generate-registry.mjs --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for workflow in sorted(Path('.github/workflows').glob('*.y*ml')):
              for number,line in enumerate(workflow.read_text(encoding='utf-8').splitlines(),1):
                  m=re.match(r'^\s*-\s*uses:\s*([^#\s]+)',line)
                  if not m or m.group(1).startswith('./'):
                      continue
                  if not re.search(r'@[0-9a-f]{40}$',m.group(1)):
                      bad.append((workflow.as_posix(),number,m.group(1)))
          if bad:
              raise SystemExit(f'mutable GitHub Action references remain: {bad}')
          print('all final external action references are immutable')
          PY
          git diff --check

          git add -A
          git commit -m "Reconcile Grammar Glass growth-day frontier"
          git push origin HEAD:integration/growth-days-20260912
