name: Recover current Grammar Glass source

on:
  push:
    branches:
      - recovery/merged-grammar-glass-current
    paths:
      - .github/workflows/recover-current-grammar-glass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_REPO: https://github.com/mike-axiom-mir/axm-collaboration-platform.git
      SOURCE_BRANCH: codex/grammar-glass-open-discovery-invariant-v1
      SOURCE_SHA: d14ee2e89e994d16ffcdcd5cfcd7fc85f73b69c3
      SOURCE_PR61_MERGE: 2961d42f96ddc6bdb082415e0714a44bcbd61535
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/merged-grammar-glass-current
          fetch-depth: 0

      - name: Recover exact current source bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-grammar-source
          git clone --filter=blob:none --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" /tmp/axm-grammar-source
          actual="$(git -C /tmp/axm-grammar-source rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA" || { echo "SOURCE_HEAD_MOVED:$actual"; exit 1; }

          src=/tmp/axm-grammar-source/shared/code-capability-fabric/language-organs
          dst=shared/code-capability-fabric/language-organs
          rm -rf shared tools/grammar-glass
          mkdir -p "$dst" tools

          cp -a /tmp/axm-grammar-source/tools/grammar-glass tools/grammar-glass
          cp -a "$src"/code-grammar-glass* "$dst"/
          cp -a "$src"/generate-code-grammar-glass-snapshot.js "$dst"/
          cp -a "$src"/selftest-code-grammar-glass*.js "$dst"/

          # Runtime dependencies required by the live 102-profile Grammar Glass source.
          cp -a "$src"/grammar-profile-registry.js "$dst"/
          cp -a "$src"/registry.js "$dst"/
          cp -a "$src"/families.json "$dst"/
          cp -a "$src"/organ.schema.json "$dst"/
          cp -a "$src"/organs "$dst"/
          cp -a "$src"/build-grammar-profiles.py "$dst"/
          cp -a "$src"/selftest-grammar-profiles.js "$dst"/
          cp -a "$src"/provenance.json "$dst"/

          # Interglass binds to the existing five-slot software experiment sandbox contract.
          cp -a "$src"/code-built-software-experiment-sandbox.js "$dst"/
          cp -a "$src"/code-built-software-experiment-sandbox.contract.json "$dst"/

      - name: Add focused standalone repo surfaces
        shell: bash
        run: |
          set -euo pipefail
          cat > README.md <<'EOF'
          # AXM Grammar Glass

          Standalone recovery of the current merged Grammar Glass / Code Twister implementation.

          This repository contains the actual source code, browser viewer, contracts, tests, live 102-profile grammar snapshot, organ registry data, and the bounded sandbox dependency needed by the current Interglass lane. It does not depend on a clone script or a source-code redirect to operate.

          ## Current recovered source

          - Source repository: `mike-axiom-mir/axm-collaboration-platform`
          - Grammar Glass package lineage: PR #61 merged at `2961d42f96ddc6bdb082415e0714a44bcbd61535`
          - Latest overlay: PR #74 open-discovery invariant
          - Exact recovered head: `d14ee2e89e994d16ffcdcd5cfcd7fc85f73b69c3`
          - Base exploration mode: `OPEN_DISCOVERY`
          - Snapshot contract: `1.4.0`
          - Live grammar profiles: `102`
          - Typed structural atoms in the verified fixture: `1122`

          ## Layout

          - `shared/code-capability-fabric/language-organs/` - Grammar Glass core, contracts, tests and bound 102-profile registry snapshot.
          - `tools/grammar-glass/` - DRAFTSKY viewer, StarZoom, vessel view, Interglass browser executor and execution-history views.
          - `SOURCE_PROVENANCE.md` - exact recovery boundary and truth notes.

          ## Verify locally

          Requires Node.js 20+ and Python 3.12+.

          ```bash
          npm test
          ```

          Generate a replayable viewer snapshot:

          ```bash
          npm run snapshot > grammar-glass-snapshot.json
          ```

          Then open `tools/grammar-glass/index.html` and load the generated snapshot.

          ## Authority boundary

          Grammar Glass remains an observation, exploration and bounded candidate-forming system. Open discovery does not require a target, benchmark, fitness function or winner. The Draft Mirror does not control the cycle. Draft Stars are receipts rather than quality votes. Automatic re-entry, selection, promotion, merge and CANON authority remain absent.
          EOF

          cat > SOURCE_PROVENANCE.md <<EOF
          # Source provenance

          This repository was recovered from the existing AXM Grammar Glass implementation without redesigning the recovered source files.

          ## Recovery source

          - repository: \`mike-axiom-mir/axm-collaboration-platform\`
          - exact source commit: \`$SOURCE_SHA\`
          - source branch at recovery: \`$SOURCE_BRANCH\`
          - PR #61 merge commit beneath the latest overlay: \`$SOURCE_PR61_MERGE\`
          - PR #74 adds the explicit \`OPEN_DISCOVERY\` invariant on top of that merged source.

          The files copied from the source repository are byte copies at the exact source commit. The only newly authored repository surfaces are this provenance note, the root README, package scripts and the focused verification workflow.

          ## Included source boundary

          1. All files under \`tools/grammar-glass/\`.
          2. All \`code-grammar-glass*\` modules and contracts.
          3. Grammar Glass snapshot generator and Grammar Glass selftests.
          4. The live 102-profile grammar/organ registry data required by \`loadGrammarSource()\`.
          5. The bounded built-software experiment sandbox module and contract required by Interglass.

          No unrelated Work Context Dock, Production Draft, Developer Relationship Plane, route, keyboard, template or broader collaboration-platform modules were copied merely because they lived beside Grammar Glass.

          ## Truth boundary

          Recovery preserves source and provenance. It does not claim that deterministic replay proves real-world software correctness, that cross-grammar influence is training or learned weights, that a visual formation is executable software, or that the browser sandbox is equivalent to an OS/container/VM boundary.
          EOF

          cat > package.json <<'EOF'
          {
            "name": "axm-grammer-glass",
            "version": "0.1.0-recovered",
            "private": true,
            "description": "Standalone AXM Grammar Glass / Code Twister recovery",
            "scripts": {
              "test": "node shared/code-capability-fabric/language-organs/selftest-code-grammar-glass.js && node shared/code-capability-fabric/language-organs/selftest-code-grammar-glass-memory.js && node shared/code-capability-fabric/language-organs/selftest-code-grammar-glass-interglass.js && node shared/code-capability-fabric/language-organs/selftest-code-grammar-glass-execution-history.js",
              "snapshot": "node shared/code-capability-fabric/language-organs/generate-code-grammar-glass-snapshot.js --seed 6f2d8b4abef8ebf661925d5ce9d1aeea05b584055e8bdc96b9f857fd66d65e0f --day standalone-grammar-glass --ticks 6 --stars 4"
            },
            "engines": {
              "node": ">=20"
            }
          }
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/verify-grammar-glass.yml <<'EOF'
          name: Verify standalone Grammar Glass

          on:
            push:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "20"
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Syntax and contracts
                  run: |
                    for f in shared/code-capability-fabric/language-organs/code-grammar-glass*.js shared/code-capability-fabric/language-organs/generate-code-grammar-glass-snapshot.js shared/code-capability-fabric/language-organs/selftest-code-grammar-glass*.js tools/grammar-glass/*.js; do node --check "$f"; done
                    for f in shared/code-capability-fabric/language-organs/code-grammar-glass*.contract.json shared/code-capability-fabric/language-organs/code-built-software-experiment-sandbox.contract.json; do python -m json.tool "$f" >/dev/null; done
                    grep -q 'OPEN_DISCOVERY' shared/code-capability-fabric/language-organs/code-grammar-glass.contract.json
                - name: Run Grammar Glass selftests
                  run: npm test
                - name: Verify current snapshot contract
                  run: |
                    npm run snapshot > /tmp/grammar-glass-snapshot.json
                    python - /tmp/grammar-glass-snapshot.json <<'PY'
                    import json, sys
                    p=json.load(open(sys.argv[1], encoding='utf-8'))
                    assert p['schema']=='axm.code.grammar-glass-visual-snapshot.v1'
                    assert p['version']=='1.4.0'
                    assert p['profileCount']==102
                    assert p['atomCount']==1122
                    assert len(p['draftSky'])==4
                    assert p['interglass']['state']=='EXECUTION_READY'
                    assert p['interglass']['runRequest']['truth']['automaticReentryAllowed'] is False
                    assert p['executionSky']==[]
                    assert p['truth']['executionStarCountIsNotQuality'] is True
                    assert p['truth']['executionHistoryDoesNotFeedTwisterAutomatically'] is True
                    PY
                - name: Verify viewer surfaces
                  run: |
                    grep -q 'MOVING TOROIDAL FIELD' tools/grammar-glass/index.html
                    grep -q 'REACTIVE DRAFT MIRROR GLASS' tools/grammar-glass/index.html
                    grep -q 'DOUBLE GLASS' tools/grammar-glass/index.html
                    grep -q 'INTERGLASS SANDBOX EXECUTION LANE' tools/grammar-glass/index.html
                    grep -q 'EXECUTION CONSTELLATION · RETURN HISTORY' tools/grammar-glass/index.html
                    grep -q 'STAR NAVIGATOR' tools/grammar-glass/starzoom-steward.js
                    git diff --check
          EOF

          # Remove this one-time recovery workflow from the final recovered tree.
          rm -f .github/workflows/recover-current-grammar-glass.yml

      - name: Verify recovered tree before commit
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run snapshot > /tmp/grammar-glass-snapshot.json
          python - /tmp/grammar-glass-snapshot.json <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['schema']=='axm.code.grammar-glass-visual-snapshot.v1'
          assert p['version']=='1.4.0'
          assert p['profileCount']==102
          assert p['atomCount']==1122
          assert p['interglass']['state']=='EXECUTION_READY'
          assert p['truth']['executionHistoryDoesNotFeedTwisterAutomatically'] is True
          PY
          grep -q 'OPEN_DISCOVERY' shared/code-capability-fabric/language-organs/code-grammar-glass.contract.json
          git diff --check

      - name: Commit recovered source to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AXM Grammar Glass Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Recover current merged Grammar Glass source"
          git push origin HEAD:recovery/merged-grammar-glass-current
